<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420" role="img" aria-label="Agents Automation iOS and Android">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1F2937" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1500" height="420" fill="url(#bg)"/>
  <rect width="1500" height="420" fill="url(#grid)" opacity="0.45"/>
  <circle cx="1280" cy="80" r="160" fill="#38BDF8" opacity="0.08"/>
  <circle cx="1380" cy="320" r="120" fill="#818CF8" opacity="0.10"/>
  <circle cx="120" cy="340" r="140" fill="#34D399" opacity="0.07"/>
  <rect x="0" y="0" width="1500" height="4" fill="url(#accent)"/>
  <text x="750" y="175" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700">Munish Kumar</text>
  <text x="750" y="240" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="500">Agents | Automation | iOS &amp; Android</text>
  <text x="750" y="295" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Expertise across agentic systems, mobile products, and platform engineering</text>
</svg>
